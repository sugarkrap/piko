kernel:
  - type: mkdir
    remote: "${PIKO_BOOT_DIR}"
  - type: put_file
    local: "${KERNEL_DIR}/arch/arm/boot/zImage"
    remote: "${PIKO_KERNEL}"
    mode: "0644"

sound_modules:
  - type: mkdir
    remote: "/lib/modules/${KVER}/zaurus-audio"
  - type: put_tree_from_list
    list_var: AUDIO_MODULES
    list_file: "${REPO}/tools/kernel/kernel-modules.sh"
    local_base: "${KERNEL_DIR}"
    remote_base: "/lib/modules/${KVER}/zaurus-audio"
    flatten: "true"
    mode: "0644"

wifi_modules:
  - type: put_tree_from_list
    list_var: WIFI_MODULES
    list_file: "${REPO}/tools/kernel/kernel-modules.sh"
    local_base: "${KERNEL_DIR}"
    strip_prefix: "kernel/"
    remote_base: "/lib/modules/${KVER}"
    mode: "0644"

sd_modules:
  - type: put_tree_from_list
    list_var: SD_MODULES
    list_file: "${REPO}/tools/kernel/kernel-modules.sh"
    local_base: "${KERNEL_DIR}"
    strip_prefix: "kernel/"
    remote_base: "/lib/modules/${KVER}"
    mode: "0644"

