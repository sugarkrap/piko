# Bring the Prism2 card up as a client (station), not the hostap default of
# Master/AP mode. iw_mode is declared in hostap_hw.c, which is #include'd
# directly into hostap_cs.c (see drivers/net/wireless/intersil/hostap/
# Makefile: hostap-y omits hostap_hw.o, and hostap_cs.c does
# `#include "hostap_hw.c"`) -- so the parameter belongs to hostap_cs, NOT
# the core hostap module (confirmed via `modinfo hostap` vs. `modinfo
# hostap_cs`). Setting it on "hostap" is silently ignored by the kernel
# and forces every card bring-up through a flaky runtime Master->Managed
# mode switch instead. This rule fires whenever mdev auto-modprobes
# hostap_cs for an inserted card.
options hostap_cs iw_mode=2
