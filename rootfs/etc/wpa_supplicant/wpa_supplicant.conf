# wpa_supplicant config for the Prism2/hostap card (wlan0, WEXT driver).
# Edit this file with real network(s), then: wpa_cli -i wlan0 reconfigure
# (or reboot). ctrl_interface lets wpa_cli inspect/control it live.

ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=1

# Open hotspot "D6F7" (no encryption).
network={
	ssid="D6F7"
	key_mgmt=NONE
	priority=5
}

