# Screen rotation on the swivel hinge -- read by flipd (userspace/src/flipd.c)
# and, for portrait_invert, by the X server. Re-read on every switch event,
# so an edit takes effect on the next swivel.
# See docs/HOWTO-SCREEN-ROTATION.md.

# Master switch. 0 stops flipd changing orientation at all -- including
# leaving alone whatever orientation you set by hand.
enabled=1

# Which way round the tablet-mode switch reads. If the screen goes PORTRAIT
# when you open the clamshell and LANDSCAPE when you swivel it flat, this is
# the line to change: set it to 1. Nothing needs rebuilding.
switch_invert=0

# Portrait touchscreen mapping. Going from landscape to portrait swaps the
# digitiser's axes and reverses exactly one of them; this says which.
#
# Only matters in portrait, and only if taps land MIRRORED along one axis
# (you tap top-left and it registers bottom-left). Try the other value.
#
# If instead taps land TRANSPOSED in portrait (you tap top-right and it
# registers bottom-left), the swap itself is wrong and this key will not
# fix it -- that is a code change in EvdevPtrAbsolute() in the xserver fork.
portrait_invert=x
