# Screen rotation on the swivel hinge -- read by flipd (userspace/src/flipd.c).
# Re-read on every switch event, so an edit takes effect on the next swivel.
# See docs/HOWTO-SCREEN-ROTATION.md.

# Master switch. 0 stops flipd touching the display at all -- including
# leaving alone any flip you set by hand with "flip".
enabled=1

# Which way round the tablet-mode switch reads. If the screen comes out
# upside down in the clamshell posture and correct when swivelled, this is
# the line to change: set it to 1. Nothing else needs rebuilding.
switch_invert=0
