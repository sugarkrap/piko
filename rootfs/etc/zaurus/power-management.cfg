# power-management.cfg -- brightd's dim/blank/suspend policy.
#
# Read by /usr/sbin/brightd at startup and re-read automatically whenever
# this file's mtime changes -- no reload signal needed (this device's
# busybox has no kill/killall/pkill to send one with anyway). Edit, save,
# and the new values apply within a couple of seconds.
#
# Format: bare key=value, one per line. '#' starts a comment. No quoting,
# no trailing comments on a value line, no whitespace trimming beyond
# what's shown here -- keep entries exactly like the commented-out
# examples below.
#
# Flags passed to brightd on its command line (see the "brightd" line in
# rootfs/etc/init.d/rcS) always win over whatever is set here, even after
# a reload -- so a manual "brightd -d 5" for testing is never silently
# overridden by this file.
#
# All values below are the compiled-in defaults. This file does not need
# to exist at all for brightd to run -- uncomment only what you want to
# change.

# dim_secs=60
# blank_secs=300
# dim_level=5

# suspend_on_lid: put the WHOLE SYSTEM to sleep (echo mem >
# /sys/power/state) when the lid closes, not just the backlight.
#
# OFF by default, and that is deliberate, not timid. This project's board
# is the LAST SPARE ONE, with no serial console and no USB -- the only way
# in is WiFi -> SSH (see AGENTS.md). A suspend that goes to sleep but never
# wakes is not a "power-cycle and try again" situation the way it would be
# on ordinary hardware: it is the one remote-access path gone, with nobody
# local to press anything.
#
# Before ever setting this to yes, confirm resume actually works by
# running this BY HAND over SSH, more than once:
#
#   echo mem > /sys/power/state
#
# Only turn this on once that has come back reliably every time.
# suspend_on_lid=yes
