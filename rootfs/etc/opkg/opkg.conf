# /etc/opkg/opkg.conf -- package manager configuration.
#
# Read the two notes below before editing. Both describe ways this file
# fails SILENTLY, with no error and no visible symptom until something is
# already wrong on the device.


# ---------------------------------------------------------------------
# ARCHITECTURES -- this is the retro-compatibility gate. Do not remove.
# ---------------------------------------------------------------------
#
# "piko" is this project's own architecture tag: ARM EABI, uClibc,
# built by tools/build-uclibc-toolchain.sh. Packages built by
# tools/make-ipk.sh declare it. "all" is for architecture-independent
# packages (scripts, data, themes).
#
# Sharp-era Zaurus packages declare "arm", which means something entirely
# different -- OABI, glibc 2.2.2, and usually Qtopia paths under
# /home/QtPalmtop. They are not merely old, they are a different ABI, and
# nothing in this rootfs can load them. "arm" is therefore deliberately
# ABSENT from this list, which is what makes opkg refuse them.
#
# *** THE ABSENCE IS LOAD-BEARING, AND opkg DOES NOT FAIL CLOSED. ***
#
# If these arch lines are deleted, or if opkg is ever built without
# --sysconfdir=/etc so that it never finds this file, opkg does not
# complain and does not refuse anything. It falls back to a built-in
# list -- {all, noarch, HOST_CPU_STR} (libopkg/opkg_conf.c) -- and
# HOST_CPU_STR is filled in from the configure --host triplet, so it is
# literally the string "arm". In that state opkg accepts Sharp packages
# and installs them cleanly and silently.
#
# Verified under qemu-arm, both directions:
#   with these lines:     Sharp arm package -> refused, exit 255
#   with them removed:    Sharp arm package -> "Installing sharpapp (1.0)"
#
# tools/test-opkg-gate.sh re-runs that check. Run it if you touch this.
#
# When retro-compatibility IS ready, do not just add "arm" here -- that
# would also re-admit every genuinely incompatible Sharp package. Give
# the translated packages their own tag instead.
arch all   1
arch piko  10


# ---------------------------------------------------------------------
# DESTINATIONS -- note what is NOT here.
# ---------------------------------------------------------------------
#
# Only the NAND root is declared. The SD card destination
# (/mnt/card/.zaurus) is deliberately NOT listed, even though opkg
# supports exactly this two-destination setup and that is how we install
# to the card. It is added at runtime by /usr/sbin/pkgadd, with
# --add-dest, and only after that script has confirmed a card is really
# mounted.
#
# The reason is that pkg_dest_init() (libopkg/pkg_dest.c) calls
# file_mkdir_hier() on every declared destination during config parsing
# -- before any command runs, and regardless of which command it is. With
# a `dest card /mnt/card/.zaurus` line here and no card in the slot,
# /mnt/card is an empty mountpoint on the jffs2 root, so opkg silently
# creates /mnt/card/.zaurus/var/lib/opkg/... on the NAND itself.
#
# Verified: with the card line present and no card mounted, a bare
# `opkg list-installed` -- a read-only query -- was enough to create
#     /mnt/card/.zaurus/var/lib/opkg/info
# on the root filesystem. Those directories then shadow the real card
# when one IS inserted, and they consume the ~68 MiB root.
dest root /


# ---------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------
# These match opkg's compiled-in defaults (--prefix=/usr
# --localstatedir=/var) and are written out explicitly so that a
# rebuild with different configure flags cannot quietly relocate the
# package database. /var/lib/opkg is created by /etc/init.d/rcS.
option info_dir     /var/lib/opkg/info
option status_file  /var/lib/opkg/status
option lists_dir    /var/lib/opkg/lists
option cache_dir    /var/cache/opkg
option lock_file    /var/run/opkg.lock

# There is no tmpfs /tmp on this rootfs -- it is jffs2, so unpacking a
# package writes to flash twice (once to unpack, once to install).
# Unavoidable without a tmpfs, but keep packages small.
option tmp_dir      /tmp


# ---------------------------------------------------------------------
# FEEDS
# ---------------------------------------------------------------------
# None by default. opkg here is built --disable-curl, so there is no HTTP
# feed support; `file:` URLs are handled by a plain copy inside
# opkg_download_internal() before any download backend is consulted, so a
# feed on the SD card works fully -- including `opkg update` and
# installing by name rather than by filename.
#
# To use a card-local feed, put Packages.gz next to the .ipk files and
# uncomment:
#
#   src/gz card file:/mnt/card/.zaurus/packages
#
# It is left commented out because a `src` line pointing at an absent
# card makes every `opkg update` fail noisily for no benefit.
