name: pubwish release uwu

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  KERNEL_VERSION: "7.1.4"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential git autoconf automake bison flex texinfo \
              gperf help2man libtool-bin libtool libncurses-dev unzip wget xz-utils \
              patch gawk python3-dev python3 python3-pip rsync bc libssl-dev libelf-dev \
              cpio mtd-utils file pkg-config x11proto-dev gcc-multilib g++-multilib
          sudo pip3 install --break-system-packages --quiet jefferson

      - name: install a jdk 8 for phoneme
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-v1-${{ env.KERNEL_VERSION }}-${{ hashFiles('tools/toolchain/**') }}

      - name: cache busybox download
        uses: actions/cache@v4
        with:
          path: initramfs/busybox-*.tar.bz2
          key: busybox-src-${{ hashFiles('tools/kernel/build-initramfs.sh') }}

      - name: cache bootstrap kernel-src
        uses: actions/cache@v4
        with:
          path: kernel-src-bootstrap
          key: kernel-src-bootstrap-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel.config-corgi-7.1.4-minimal', 'modules/**', 'drivers/**', 'tools/kernel/setup-kernel-src.sh') }}

      - name: cache stage-2 kernel-src
        uses: actions/cache@v4
        with:
          path: kernel-src
          key: kernel-src-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel.config-corgi-7.1.4', 'modules/**', 'drivers/**', 'tools/kernel/setup-kernel-src.sh') }}

      - name: cache third-party x11 source downloads
        uses: actions/cache@v4
        with:
          path: userspace/.thirdparty-cache
          key: thirdparty-src-${{ hashFiles('tools/userspace/build-thirdparty-deps.sh') }}

      - name: cache ssh source downloads
        uses: actions/cache@v4
        with:
          path: |
            userspace/src/dropbear-*.tar.bz2
            userspace/src/openssh-*.tar.gz
          key: ssh-src-${{ hashFiles('tools/userspace/build-ssh.sh') }}

      - name: cache kexec source download
        uses: actions/cache@v4
        with:
          path: userspace/src/kexec-tools-*.tar.xz
          key: kexec-src-${{ hashFiles('tools/userspace/build-kexec.sh') }}

      - name: cache alsa source downloads
        uses: actions/cache@v4
        with:
          path: |
            userspace/src/alsa-lib-*.tar.bz2
            userspace/src/alsa-utils-*.tar.bz2
          key: alsa-src-${{ hashFiles('tools/userspace/build-alsa.sh') }}

      - name: cache sdl source downloads
        uses: actions/cache@v4
        with:
          path: |
            userspace/src/SDL-*.tar.gz
            userspace/src/SDL_image-*.tar.gz
            userspace/src/SDL_mixer-*.tar.gz
          key: sdl-src-${{ hashFiles('tools/userspace/build-sdl.sh', 'tools/userspace/build-sdl-image.sh', 'tools/userspace/build-sdl-mixer.sh') }}

      - name: build the sd card payload
        run: JDK_DIR="$JAVA_HOME" ./build.sh

      - name: locate the pikostore ipk
        run: |
          IPK="$(ls pikostore_*_piko.ipk 2>/dev/null | head -1)"
          if [ -z "$IPK" ]; then
              echo "::error::no pikostore_*_piko.ipk at the repo root -- tools/userspace/build-pikostore.sh (run by build-x11-stack.sh, run by build.sh) should have produced one" >&2
              exit 1
          fi
          echo "PIKOSTORE_IPK=$IPK" >> "$GITHUB_ENV"

      - name: package one payload per flavor
        run: |
          TAG="sd-card-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ARCHIVES=""
          for flavor in nand sd cf; do
              if [ ! -d "sd-card/$flavor" ]; then
                  echo "::error::build.sh produced no sd-card/$flavor payload" >&2
                  exit 1
              fi
              name="piko-$flavor-$TAG"
              mkdir -p "dist/$name"
              cp "sd-card/$flavor/"* "dist/$name/"
              tar -C dist -czf "$name.tar.gz" "$name"
              ARCHIVES="$ARCHIVES $name.tar.gz"
              echo "### $flavor payload" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tar -tzvf "$name.tar.gz" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          echo "ARCHIVES=${ARCHIVES# }" >> "$GITHUB_ENV"
          echo "### bootstrap sizes against the 1294336-byte mtd1 kernel slot" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for flavor in nand sd cf; do
              sz="$(stat -c '%s' "flash/zImage-$flavor")"
              printf '%-5s %8s bytes  %3d%%\n' \
                  "$flavor" "$sz" "$((sz * 100 / 1294336))" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### pikostore ipk" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$PIKOSTORE_IPK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: keep the payload even if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ env.TAG }}
          path: |
            piko-*-${{ env.TAG }}.tar.gz
            ${{ env.PIKOSTORE_IPK }}
          if-no-files-found: error

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
              if gh release view "$TAG" >/dev/null 2>&1; then
                  gh release upload --clobber "$TAG" $ARCHIVES "$PIKOSTORE_IPK"
              else
                  gh release create "$TAG" $ARCHIVES "$PIKOSTORE_IPK" \
                      --title "piko sd card $TAG" \
                      --target "${{ github.sha }}" \
                      --notes ""
              fi
          }
          n=0
          until publish; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                  echo "::error::gh kept failing to publish $TAG -- the build itself was fine, rerun this job" >&2
                  exit 1
              fi
              echo "publishing failed (attempt $n), retrying in 30s"
              sleep 30
          done
