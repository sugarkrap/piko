name: pubwish release uwu

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  KERNEL_VERSION: "7.1.4"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: keep curl off http/2
        run: printf -- '--http1.1\n' >> "$HOME/.curlrc"

      - name: compute cache keys
        run: |
          modules_hash="$(find modules -path 'modules/initramfs*' -prune -o -type f -print0 \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)"
          echo "MODULES_HASH=$modules_hash" >> "$GITHUB_ENV"
          stage_hash="$( { git submodule status --recursive; \
              find tools/userspace tools/toolchain -type f -print0 | sort -z | xargs -0 sha256sum; \
            } | sha256sum | cut -c1-40)"
          echo "STAGE_HASH=$stage_hash" >> "$GITHUB_ENV"

      - name: install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential git autoconf automake bison flex texinfo \
              gperf help2man libtool-bin libtool libncurses-dev unzip wget xz-utils \
              patch gawk python3-dev python3 python3-pip rsync bc libssl-dev libelf-dev \
              cpio mtd-utils file pkg-config x11proto-dev gcc-multilib g++-multilib \
              fakeroot e2fsprogs
          sudo pip3 install --break-system-packages --quiet jefferson

      - name: install a jdk 8 for phoneme
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-v1-${{ env.KERNEL_VERSION }}-${{ hashFiles('tools/toolchain/**') }}

      - name: cache the kernel tarball
        uses: actions/cache@v4
        with:
          path: build/kernel/dl
          key: kernel-tarball-${{ env.KERNEL_VERSION }}

      - name: cache bootstrap kernel-src
        uses: actions/cache@v4
        with:
          path: build/kernel/bootstrap
          key: kernel-src-bootstrap-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel.config-corgi-7.1.4-minimal', 'tools/kernel/setup-kernel-src.sh') }}-${{ env.MODULES_HASH }}

      - name: cache stage-2 kernel-src
        uses: actions/cache@v4
        with:
          path: build/kernel/src
          key: kernel-src-${{ env.KERNEL_VERSION }}-${{ hashFiles('kernel.config-corgi-7.1.4', 'tools/kernel/setup-kernel-src.sh') }}-${{ env.MODULES_HASH }}

      - name: cache the cross-built x11 and third-party prefix
        uses: actions/cache@v4
        with:
          path: build/target
          key: stage-target-${{ env.KERNEL_VERSION }}-${{ env.STAGE_HASH }}

      - name: cache the cross-built userspace stages
        uses: actions/cache@v4
        with:
          path: |
            build/stage-kexec
            build/stage-ssh
            build/stage-alsa
            build/stage-mplayer
            build/stage-phoneme
            build/stage-busybox
          key: stages-${{ env.KERNEL_VERSION }}-${{ env.STAGE_HASH }}

      - name: cache third-party source downloads
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ hashFiles('tools/userspace/build-*.sh', 'tools/kernel/build-initramfs.sh') }}

      - name: build the sd card payload
        run: JDK_DIR="$JAVA_HOME" ./build.sh

      - name: locate the pikostore ipk
        run: |
          IPK="$(ls build/pikostore_*_piko.ipk 2>/dev/null | head -1)"
          if [ -z "$IPK" ]; then
              echo "::error::no build/pikostore_*_piko.ipk -- tools/userspace/build-pikostore.sh (run by build-x11-stack.sh, run by build.sh) should have produced one" >&2
              exit 1
          fi
          echo "PIKOSTORE_IPK=$IPK" >> "$GITHUB_ENV"

      - name: package the install and update tarballs
        run: |
          TAG="sd-card-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          for d in build/sd-card/sd build/sd-card/update/.zaurus; do
              if [ ! -d "$d" ]; then
                  echo "::error::build.sh produced no $d" >&2
                  exit 1
              fi
          done
          rm -rf dist
          mkdir -p dist/piko
          cp build/sd-card/sd/* dist/piko/
          tar -C dist -czf piko.tar.gz piko
          tar -C build/sd-card/update -czf update.tar.gz .zaurus
          echo "ARCHIVES=piko.tar.gz update.tar.gz" >> "$GITHUB_ENV"
          for a in piko.tar.gz update.tar.gz; do
              echo "### $a" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tar -tzvf "$a" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          echo "### bootstrap size against the 1294336-byte mtd1 kernel slot" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sz="$(stat -c '%s' build/flash/zImage-sd)"
          printf '%-5s %8s bytes  %3d%% of slot\n' \
              sd "$sz" "$((sz * 100 / 1294336))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=bootstrap size::slot=1294336 sd=$sz"
          echo "### pikostore ipk" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la "$PIKOSTORE_IPK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: keep the payload even if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ env.TAG }}
          path: |
            piko.tar.gz
            update.tar.gz
            ${{ env.PIKOSTORE_IPK }}
          if-no-files-found: error

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
              if gh release view "$TAG" >/dev/null 2>&1; then
                  gh release upload --clobber "$TAG" $ARCHIVES "$PIKOSTORE_IPK"
              else
                  gh release create "$TAG" $ARCHIVES "$PIKOSTORE_IPK" \
                      --title "piko sd card $TAG" \
                      --target "${{ github.sha }}" \
                      --notes ""
              fi
          }
          n=0
          until publish; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                  echo "::error::gh kept failing to publish $TAG -- the build itself was fine, rerun this job" >&2
                  exit 1
              fi
              echo "publishing failed (attempt $n), retrying in 30s"
              sleep 30
          done
