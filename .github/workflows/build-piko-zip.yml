name: Build piko.zip (SD-card recovery-flash package)

# Builds piko.zip: the complete SD-card recovery-flash package Cacko's
# recovery menu needs -- updater.sh (Cacko-cipher-encoded), piko-install
# (the freestanding ARM OABI flasher), piko.cfg (combined mtd1+mtd3
# targets), the bootstrap zImage (mtd1/smf, kernel.config-corgi-
# 7.1.4-minimal + embedded initramfs), and mtd3.jffs2 (the full stage-2
# home partition image). Uploaded flat, no subdirectories -- this needs to
# land directly on an SD card root, matching how piko-install and
# updater.sh are invoked at /mnt/card/... (see flash/updater-uncoded.sh).
#
# Three genuinely different toolchains are involved:
#   - the bootstrap/stage-2 kernels themselves build with a normal EABI
#     cross-gcc (gcc-arm-linux-gnueabi via apt, same as
#     build-update-package.yml already uses).
#   - piko-install/piko-backup specifically (freestanding, no libc at all)
#     need a cross-gcc that can still emit genuine pre-EABI OABI code via
#     -mabi=apcs-gnu -- forced explicitly in tools/build-piko-install.sh's
#     own CFLAGS, since they run under Cacko's original stock environment
#     before this project's own kernel is ever flashed.
#     tools/build-oabi-toolchain.sh provisions a compiler for this: it
#     first checks whether any already-available compiler (e.g. the
#     apt-installed gcc-arm-linux-gnueabi above) happens to produce
#     genuine OABI code with that flag -- if not, it builds this
#     project's own dev toolchain from source via crosstool-NG, from the
#     tracked config at tools/oabi-toolchain.config. That from-source
#     build is slow but cacheable, and every acceptance check in this
#     pipeline is a real `readelf -h` flags check, never just "the
#     compiler exited 0" (see tools/build-piko-install.sh's header
#     comment for exactly why that distinction matters here). Since these
#     two are genuinely freestanding, glibc vs uclibc is irrelevant to
#     them -- the apt glibc cross-gcc passing this check is a perfectly
#     valid, fast outcome, not a shortcut that skips something they need.
#   - the bootstrap initramfs's static busybox is a completely different
#     requirement: it is NOT freestanding (it links a real libc) and does
#     NOT need OABI codegen (tools/build-initramfs.sh never passes
#     -mabi=apcs-gnu -- the bootstrap kernel it boots under is plain EABI,
#     see above; CONFIG_OABI_COMPAT in kernel.config-corgi-7.1.4-minimal
#     exists for OABI *userspace* binaries like piko-install to still run
#     under it, not because the busybox itself needs to be OABI). All it
#     needs is a small uClibc so it doesn't blow the bootstrap zImage's
#     1,294,336-byte NAND-slot budget the way a glibc-static build would --
#     exactly the same requirement scp/sftp-server below has, so it uses
#     that same X11/Matchbox + SSH toolchain rather than oabi_toolchain's
#     output (which, per the paragraph above, may legitimately BE glibc).
#   - scp/sftp-server/dropbear (tools/build-ssh.sh) need a uClibc
#     toolchain specifically -- not the apt glibc cross-gcc, because
#     glibc's getpwnam/getpwuid go through NSS and dlopen() modules this
#     rootfs does not have, even from a static binary. It is built by
#     tools/build-uclibc-toolchain.sh into its OWN directory
#     (PIKO_TOOLCHAIN_DIR=toolchain-x11, shared with
#     build-update-package.yml, which needs the same toolchain for the
#     desktop payload), deliberately not the default toolchain/ where the
#     OABI toolchain above installs a same-named triplet. See the steps
#     themselves for the full argument.
#
# Two independent kernel builds happen against the SAME reconstructed
# kernel-src/linux-7.1.4 tree (tools/setup-kernel-src.sh, shared with
# build-update-package.yml): the full kernel.config-corgi-7.1.4 stage-2
# build happens in-tree (same as build-update-package.yml always did);
# the bootstrap kernel.config-corgi-7.1.4-minimal build happens
# out-of-tree via `make O=...` into its own build directory, so it never
# touches the stage-2 build's in-tree .config or object files.
#
# A THIRD toolchain, entirely separate from the two above: the X11/
# Matchbox desktop (userspace/src/* submodules) needs binaries that
# dynamically link against uClibc-ng -- neither the apt EABI glibc-gcc
# (wrong libc) nor the OABI-flavoured toolchain above (freestanding, built
# from a different crosstool-NG config -- tools/oabi-toolchain.config --
# that is not known to produce working shared libraries at all) can be
# reused for this. It is built by tools/build-uclibc-toolchain.sh, same
# tool a fresh dev machine runs per docs/HANDOFF-2026-07-31-BUILD-FROM-SCRATCH.md,
# into its OWN directory (PIKO_TOOLCHAIN_DIR) -- deliberately NOT the
# default toolchain/, which is where the OABI toolchain above already
# lives, to guarantee the two builds cannot collide or silently overwrite
# one another regardless of which one runs or restores from cache first.
#
# The X11/Matchbox stack itself is NOT separately cached across runs: it
# builds in place inside the checked-out submodules under userspace/src/,
# and restoring a cache there would silently overwrite whatever commit
# actions/checkout --recursive just correctly checked out with stale
# content from a previous run -- wrong source code shipped as if it were
# current. Only the toolchain (self-contained, keyed on its own
# crosstool-NG config) and the third-party download cache (raw tarballs,
# keyed on the version pins in tools/build-thirdparty-deps.sh) are safe to
# persist. Expect this job to be genuinely slow on a cold cache -- that is
# the real cost of the from-scratch reproducibility this buys.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "flash/src/piko-install.c"
      - "flash/piko-backup.c"
      - "flash/updater-uncoded.sh"
      - "tools/encode-updater.py"
      - "flash/piko.cfg.mtd1-mtd3-combined"
      - "kernel.config-corgi-7.1.4-minimal"
      - "kernel.config-corgi-7.1.4"
      - "modules/**"
      - "drivers/**"
      - "initramfs/**"
      - "tools/build-initramfs.sh"
      - "tools/build-piko-install.sh"
      - "tools/build-oabi-toolchain.sh"
      - "tools/oabi-toolchain.config"
      - "flash/mtd3.jffs2"
      - "flash/build-mtd3-jffs2.sh"
      - "tools/setup-kernel-src.sh"
      - "tools/kernel-modules.sh"
      - "tools/build-ssh.sh"
      - "tools/ssh-payload.sh"
      - "tools/build-uclibc-toolchain.sh"
      - "tools/uclibc-toolchain.config"
      - "rootfs/**"
      - "tools/build-uclibc-toolchain.sh"
      - "tools/uclibc-toolchain.config"
      - "tools/build-thirdparty-deps.sh"
      - "tools/setup-x11-src.sh"
      - "tools/build-x11-stack.sh"
      # build-x11-stack.sh calls all three of these at its end -- st, FLTK
      # and toasters link against the stage it populates and are shipped in
      # the payload.
      - "tools/build-st.sh"
      - "tools/build-fltk.sh"
      - "tools/build-toasters.sh"
      - "tools/build-matchbox-payload.sh"
      # matchbox-fbrun is built by build-fltk.sh and shipped in the payload.
      - "userspace/src/**"
      - "modules/x11/**"
      - ".gitmodules"
      - ".github/workflows/build-piko-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (with LFS -- flash/mtd3.jffs2 base image; submodules -- X11/Matchbox stack)
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install ARM cross-compiler, kernel build deps, mtd-utils, crosstool-NG build deps, and X11 build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              gcc-arm-linux-gnueabi \
              bison flex bc libssl-dev libelf-dev cpio zip \
              mtd-utils file \
              build-essential git autoconf automake bison flex texinfo \
              gperf help2man libtool-bin libncurses-dev unzip wget xz-utils \
              patch gawk python3-dev rsync \
              pkg-config python3 x11proto-dev
          # x11proto-dev is the Debian/Ubuntu package for the merged
          # xorgproto headers (xproto, kbproto, randrproto, ...) -- every
          # X.Org submodule build reads these from the HOST's
          # /usr/share/pkgconfig (see tools/build-x11-stack.sh's
          # PKG_CONFIG_LIBDIR). If this package is ever renamed upstream,
          # this is the step that will fail, with a clear "Package
          # 'xproto' ... not found" from some submodule's configure.

      # Slow-but-cacheable: reproduces this project's own OABI-capable
      # crosstool-NG toolchain from source, ONLY if no already-available
      # compiler (gcc-arm-linux-gnueabi above included) actually passes
      # the real -mabi=apcs-gnu -> readelf 0x600 check. See
      # tools/build-oabi-toolchain.sh's header comment for the full
      # rationale and search order.
      - name: Cache OABI-capable toolchain (crosstool-NG build)
        id: oabi-toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain
          key: oabi-toolchain-v1-${{ hashFiles('tools/oabi-toolchain.config', 'tools/build-oabi-toolchain.sh') }}
          save-always: true

      - name: Provision OABI-capable toolchain
        id: oabi_toolchain
        run: |
          # Deliberately does NOT set EXTRA_CC_CANDIDATES to try the
          # apt-installed gcc-arm-linux-gnueabi here: that compiler is
          # glibc-cross, and while it may well also pass the OABI check
          # (untested against the real Debian/Ubuntu package -- see
          # tools/build-piko-install.sh's header comment), the bootstrap
          # initramfs's static busybox specifically needs a SMALL libc
          # (uclibc) to fit inside the 1,294,336-byte mtd1 NAND slot budget
          # alongside the compressed kernel -- a glibc-static busybox would
          # risk blowing that budget even if it "worked" for piko-install
          # alone. So this always builds (or restores from cache) this
          # project's own proven arm-unknown-linux-uclibcgnueabi toolchain,
          # used for BOTH piko-install/piko-backup and the initramfs.
          # Writes toolchain_bin_dir=<path> to $GITHUB_OUTPUT itself (see
          # report_and_exit() in the script) -- no extra plumbing needed here.
          ./tools/build-oabi-toolchain.sh

      - name: Build piko-install + piko-backup (verify genuine OABI)
        env:
          TOOLCHAIN_BIN_DIR: ${{ steps.oabi_toolchain.outputs.toolchain_bin_dir }}
        run: |
          ./tools/build-piko-install.sh --force

      # Moved ahead of "Build bootstrap initramfs" (was originally right
      # after it, alongside the SSH/X11 steps much further down) because
      # that step's static busybox needs this exact uClibc toolchain, not
      # whatever oabi_toolchain above resolved to. tools/build-oabi-
      # toolchain.sh's own find_working_cc() accepts ANY compiler that
      # merely passes its `-mabi=apcs-gnu` -> readelf 0x600 probe -- which
      # apt's gcc-arm-linux-gnueabi (glibc) does -- so oabi_toolchain's
      # output is correct for piko-install/piko-backup above (genuinely
      # freestanding, -nostdlib, no libc at all, so glibc vs uclibc is
      # irrelevant) but NOT for a real libc-linked busybox, where the size
      # difference is the entire reason this needs uclibc specifically
      # (see this workflow's header, and tools/build-initramfs.sh's own
      # CROSS_COMPILE default: arm-unknown-linux-uclibcgnueabi-, the exact
      # triplet this step produces). A long-lived warm cache on
      # oabi-toolchain-v1-... previously masked this: cached hits kept
      # reusing a REAL from-source uclibc build that had happened to be
      # built here before EXTRA_CC_CANDIDATES-style shortcuts ever got
      # taken, so the mismatch went unnoticed until that cache entry
      # finally missed and find_working_cc() took the glibc shortcut,
      # reporting a bin dir with no arm-unknown-linux-uclibcgnueabi-gcc in
      # it at all.
      - name: Cache X11/Matchbox + SSH toolchain (crosstool-NG build, shared arm-unknown-linux-uclibcgnueabi)
        id: x11-toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain-x11
          # v2 (2026-08-04): v1's cache had a corrupted ncurses-6.5.tar.gz
          # baked in from some earlier interrupted run -- save-always: true
          # persisted it, and actions/cache can never overwrite an existing
          # key, so every restore kept re-verifying the same bad SHA512
          # forever. Bumping the key discards it for a clean rebuild.
          key: x11-toolchain-v2-${{ hashFiles('tools/uclibc-toolchain.config', 'tools/build-uclibc-toolchain.sh') }}
          save-always: true

      - name: Provision X11/Matchbox + SSH toolchain
        env:
          PIKO_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain-x11
        run: |
          ./tools/build-uclibc-toolchain.sh
          echo "TOOLCHAIN_BIN_DIR=${PIKO_TOOLCHAIN_DIR}/x-tools/arm-unknown-linux-uclibcgnueabi/bin" >> "$GITHUB_ENV"

      - name: Build bootstrap initramfs (static busybox, embedded in mtd1 zImage)
        run: |
          ./tools/build-initramfs.sh --force

      - name: Cache kernel-src reconstruction
        id: kernel-src-cache
        uses: actions/cache@v4
        with:
          path: kernel-src
          key: kernel-src-7.1.4-${{ hashFiles('kernel.config-corgi-7.1.4', 'kernel.config-corgi-7.1.4-minimal', 'modules/**', 'drivers/**', 'tools/setup-kernel-src.sh') }}
          save-always: true

      - name: Reconstruct kernel-src (download + apply tracked patches, full config + oldconfig in-tree)
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          ./tools/setup-kernel-src.sh

      # Runs BEFORE the stage-2 kernel build below (reordering alone turned
      # out not to be enough -- see the mrproper below for why). This is an
      # out-of-tree (O=) build, and kbuild refuses to do one against a
      # source tree that already has in-tree build state ("the source tree
      # is not clean, please run 'make ARCH=arm mrproper'"). The culprit
      # isn't stage-2's build -- it's tools/setup-kernel-src.sh itself:
      # "Reconstruct kernel-src" above copies kernel.config-corgi-7.1.4 in
      # as .config and runs oldconfig IN-TREE (see its own step name), so
      # the tree already has include/config/auto.conf etc. by the time this
      # step runs, regardless of build order relative to stage-2 -- CI
      # proved this directly (bootstrap failed the same way running first).
      #
      # tools/setup-kernel-src.sh is shared with build-update-package.yml,
      # which only ever does an in-tree build and has no reason to care
      # about this, so the fix stays local to this workflow instead of
      # touching that script: mrproper the tree immediately before this
      # out-of-tree build (wiping the in-tree config the Reconstruct step
      # just set up), then re-apply that same stage-2 config + oldconfig
      # in-tree again right after, before "Build stage-2 kernel" needs it.
      # Redoing oldconfig is cheap (Kconfig processing, not a compile) --
      # nothing here is lost, just regenerated in a different order.
      - name: Build bootstrap kernel (minimal config, out-of-tree O=, embedded initramfs)
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          make -C kernel-src/linux-7.1.4 ARCH=arm mrproper

          BOOT_O="$GITHUB_WORKSPACE/kernel-src/build-bootstrap"
          mkdir -p "$BOOT_O"
          cp kernel.config-corgi-7.1.4-minimal "$BOOT_O/.config"

          # The tracked config points CONFIG_INITRAMFS_SOURCE at a
          # machine-local dev path (see the comment in
          # kernel.config-corgi-7.1.4-minimal itself) -- repoint it at the
          # initramfs tools/build-initramfs.sh just built into this
          # checkout before oldconfig locks it in.
          INITRAMFS_CPIO="$GITHUB_WORKSPACE/initramfs/initramfs-minimal-built.cpio.gz"
          if [ ! -f "$INITRAMFS_CPIO" ]; then
            echo "::error::bootstrap initramfs not found at $INITRAMFS_CPIO -- tools/build-initramfs.sh should have produced it" >&2
            exit 1
          fi
          sed -i "s|^CONFIG_INITRAMFS_SOURCE=.*|CONFIG_INITRAMFS_SOURCE=\"$INITRAMFS_CPIO\"|" "$BOOT_O/.config"

          make -C kernel-src/linux-7.1.4 O="$BOOT_O" ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
              olddefconfig
          make -C kernel-src/linux-7.1.4 O="$BOOT_O" ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
              -j"$(nproc)" zImage

          BOOT_ZIMAGE="$BOOT_O/arch/arm/boot/zImage"
          BOOT_SIZE=$(stat -c%s "$BOOT_ZIMAGE")
          MAX_SIZE=1294336
          {
            echo "### Bootstrap kernel (kernel.config-corgi-7.1.4-minimal)"
            echo "zImage: $BOOT_SIZE bytes (NAND mtd1 slot budget: $MAX_SIZE bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BOOT_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::bootstrap zImage is $BOOT_SIZE bytes, exceeds the $MAX_SIZE-byte mtd1 NAND slot budget (docs/FLASH-MTD1-MTD3-SAFE.md) -- refusing to ship an oversized bootstrap kernel." >&2
            echo "**FAILED: bootstrap zImage exceeds the $MAX_SIZE-byte budget.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "BOOT_ZIMAGE=$BOOT_ZIMAGE" >> "$GITHUB_ENV"

      # Re-applies exactly what tools/setup-kernel-src.sh's own tail end
      # does (copy kernel.config-corgi-7.1.4 in as .config, oldconfig
      # in-tree) -- the mrproper above wiped that to give the bootstrap
      # build its required pristine tree, and stage-2's in-tree build
      # right after this has no config-generation step of its own; it just
      # expects .config to already be there, exactly as it would if
      # Reconstruct's work had never been touched.
      - name: Reconfigure kernel-src in-tree for the stage-2 build (mrproper above wiped it)
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          cp kernel.config-corgi-7.1.4 kernel-src/linux-7.1.4/.config
          ( cd kernel-src/linux-7.1.4 && yes "" | make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" oldconfig )

      - name: Build stage-2 kernel (full config, in-tree, zImage + modules)
        run: |
          make -C kernel-src/linux-7.1.4 ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
              -j"$(nproc)" zImage modules
          echo "### Stage-2 kernel (kernel.config-corgi-7.1.4)" >> "$GITHUB_STEP_SUMMARY"
          echo "zImage: $(stat -c%s kernel-src/linux-7.1.4/arch/arm/boot/zImage) bytes" >> "$GITHUB_STEP_SUMMARY"

      # Upstream release tarballs, sha256-verified by the script itself --
      # cached so a rerun doesn't re-fetch from matt.ucc.asn.au/openbsd.org.
      - name: Cache dropbear/OpenSSH release tarballs
        uses: actions/cache@v4
        with:
          path: |
            userspace/src/dropbear-*.tar.bz2
            userspace/src/openssh-*.tar.gz
          key: ssh-tarballs-${{ hashFiles('tools/build-ssh.sh') }}

      # scp + sftp-server (+ dbclient/dropbearkey) for the mtd3 image, so a
      # freshly recovery-flashed board can receive files at all. Must run
      # BEFORE the mtd3 step below, which overlays whatever is in
      # userspace/stage-ssh. tools/build-ssh.sh's NSS check enforces the
      # uClibc requirement explained above.
      - name: Build scp + sftp-server (+ a reproducible dropbear)
        run: |
          TOOLCHAIN_BIN_DIR="$GITHUB_WORKSPACE/toolchain-x11/x-tools/arm-unknown-linux-uclibcgnueabi/bin" \
              ./tools/build-ssh.sh
          {
            echo "### SSH file transfer payload (staged into mtd3.jffs2)"
            echo '```'
            find userspace/stage-ssh -type f -printf '%10s  %p\n' | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the raw downloaded tarballs -- keyed on the version pins
      # inside the script itself, so a version bump invalidates it
      # automatically. NOT userspace/stage-target (the built output): that
      # gets rebuilt fresh every run, same as the X11 submodules -- see
      # the workflow header comment for why in-place build output is not
      # safe to cache here.
      - name: Cache third-party source downloads (zlib/expat/libpng/freetype/fontconfig/xkeyboard-config/dejavu)
        uses: actions/cache@v4
        with:
          path: userspace/.thirdparty-cache
          key: thirdparty-src-v1-${{ hashFiles('tools/build-thirdparty-deps.sh') }}
          save-always: true

      - name: Build third-party X11 dependencies
        run: |
          ./tools/build-thirdparty-deps.sh

      - name: Build mtd3.jffs2 (incremental onto the git-LFS-tracked base image; includes both the SSH payload and the X11/Matchbox desktop)
        run: |
          test -f flash/mtd3.jffs2 || { echo "::error::flash/mtd3.jffs2 (LFS-tracked base image) not present after checkout -- was lfs: true honored?" >&2; exit 1; }
          file flash/mtd3.jffs2
          mkdir -p "$GITHUB_WORKSPACE/piko-package"
          # TOOLCHAIN_BIN_DIR (set above) and the build-x11-stack.sh /
          # build-matchbox-payload.sh calls this makes are what put the
          # desktop INTO the flashed image, not just build it as a
          # separate artifact -- see flash/build-mtd3-jffs2.sh.
          ./flash/build-mtd3-jffs2.sh flash/mtd3.jffs2 "$GITHUB_WORKSPACE/piko-package/mtd3.jffs2"

      - name: Assemble piko.zip
        run: |
          PKG="$GITHUB_WORKSPACE/piko-package"
          mkdir -p "$PKG"

          python3 tools/encode-updater.py flash/updater-uncoded.sh "$PKG/updater.sh"
          cp flash/piko-install "$PKG/piko-install"
          cp flash/piko.cfg.mtd1-mtd3-combined "$PKG/piko.cfg"
          cp "$BOOT_ZIMAGE" "$PKG/zImage"
          # mtd3.jffs2 already landed directly in $PKG by the previous step.

          chmod 755 "$PKG/piko-install"

          {
            echo "### piko.zip contents (md5sums, verify-before-flash -- see AGENTS.md 'last spare board')"
            echo
            echo '```'
            ( cd "$PKG" && md5sum updater.sh piko-install piko.cfg zImage mtd3.jffs2 )
            echo '```'
            echo
            echo '```'
            ( cd "$PKG" && ls -la updater.sh piko-install piko.cfg zImage mtd3.jffs2 )
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          ( cd "$PKG" && zip -j "$GITHUB_WORKSPACE/piko.zip" updater.sh piko-install piko.cfg zImage mtd3.jffs2 )

          echo "### piko.zip archive listing" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l piko.zip >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload piko.zip
        uses: actions/upload-artifact@v4
        with:
          name: piko-zip
          path: piko.zip
          if-no-files-found: error
