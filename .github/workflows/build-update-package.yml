name: Build piko-update package

# Builds the offline update.tar package for userspace/src/piko-update.c
# (flash/build-update-package.sh) and uploads it as a workflow artifact.
#
# tools/setup-kernel-src.sh reconstructs kernel-src/ from a fresh
# kernel.org download plus this repo's tracked patches (see
# docs/HANDOFF.md) -- every file it needs (including the mach-pxa/
# wireless/crypto Kconfig+Makefile wiring under modules/) is committed, so
# this should always produce a full package: kernel + modules + rootfs
# overlay. flash/qemu-smoke-test.sh then boots the result under QEMU,
# insmod's every shipped module, and runs piko-update --dry-run against
# the actual package -- the same kernel/module ABI mismatch that broke
# this device for real once already (DEADLETTER-WIFI-SSH.md). A package
# that fails this is never uploaded.
#
# The package also carries usr/sbin/piko-smf-write and (when one is
# present locally) the boot/zImage-smf bootstrap kernel. QEMU's spitz has
# no Sharp-FTL smf partition, so the smoke test cannot flash one -- it
# instead pins down that the smf paths stay inert: the writer ships, a dry
# run stages no bootstrap write, and --commit-smf with nothing pending is
# a clean no-op. The real NAND write only ever happens on hardware, by
# hand, via `smfcommit` (docs/HOWTO-OFFLINE-UPDATE.md).
#
# Note CI never carries a bootstrap image: flash/zImage-* is gitignored,
# so CI packages are always "no bootstrap included". That is the intended
# fallback, not a failure.
#
# If kernel-src reconstruction itself fails for some other reason (a
# kernel.org hiccup, an oldconfig failure, etc.), the job falls back to a
# rootfs-only package (piko-update + rootfs/ overlay, no kernel bump)
# rather than failing outright -- still a real, useful, offline update on
# its own, just without a kernel bump, and the QEMU smoke test is skipped
# in that case (nothing kernel-side to test).
#
# The kernel-src/ reconstruction (download + patch + oldconfig, the
# expensive and network-heavy part) is cached across runs keyed on the
# inputs that actually affect it, so a run where nothing kernel-related
# changed restores instantly instead of re-downloading from kernel.org.
#
# The package also carries the X11/Matchbox desktop (libX11/libXft/
# fontconfig/freetype, the four Matchbox apps, st, toasters) via
# tools/build-x11-stack.sh + tools/build-st.sh + tools/build-toasters.sh +
# tools/build-matchbox-payload.sh -- see flash/build-update-package.sh's own header for how
# that gets folded into MANIFEST. This needs a THIRD toolchain, entirely
# separate from the gcc-arm-linux-gnueabi used for the kernel/piko-update
# above: the X11 stack needs uClibc-ng, built by
# tools/build-uclibc-toolchain.sh into its own toolchain-x11/ directory so
# it can never collide with anything else. Same reasoning as the parallel
# setup in .github/workflows/build-piko-zip.yml (see that file's header
# for the full rationale) -- this is a second, independent instance of
# that same pattern for a different output package.
#
# The X11 submodule build itself is NOT cached (restoring a cache there
# could silently overwrite what actions/checkout --recursive just
# correctly checked out); only the toolchain and the third-party source
# downloads are. If the X11 toolchain/deps aren't ready for any reason,
# flash/build-update-package.sh degrades gracefully to a package without
# the desktop, same as a kernel-src failure degrades to rootfs-only --
# this job never fails just because the (much heavier, from-scratch) X11
# build had a bad day.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "userspace/src/**"
      - "userspace/desktop/**"
      - "rootfs/**"
      - "flash/build-update-package.sh"
      # Compiled into the package and exec'd by piko-update for every smf
      # operation, so a change here changes what ships.
      - "flash/piko-smf-write.c"
      # The ROM manifest generator: its output ships in every package and
      # is what the Software Center displays.
      - "tools/gen-rom-manifest.sh"
      - "CHANGELOG"
      - "tools/setup-kernel-src.sh"
      - "tools/build-ssh.sh"
      - "tools/ssh-payload.sh"
      - "tools/build-uclibc-toolchain.sh"
      - "tools/uclibc-toolchain.config"
      - "tools/build-thirdparty-deps.sh"
      - "tools/setup-x11-src.sh"
      - "tools/build-x11-stack.sh"
      - "tools/build-st.sh"
      - "tools/build-toasters.sh"
      - "tools/build-libiw.sh"
      - "tools/build-fltk.sh"
      - "tools/build-matchbox-payload.sh"
      # matchbox-fbrun lives under userspace/src and is built by
      # build-fltk.sh, so a change to it has to rebuild the payload that
      # ships it -- otherwise the update package keeps the stale binary.
      - "userspace/src/**"
      - "flash/qemu-smoke-test.sh"
      - "modules/**"
      - "modules/x11/**"
      - "kernel.config-corgi-7.1.4"
      - ".gitmodules"
      - ".github/workflows/build-update-package.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (submodules -- X11/Matchbox stack)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM cross-compiler + kernel build/QEMU/X11 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabi \
              bison flex bc libssl-dev libelf-dev \
              qemu-system-arm cpio \
              build-essential git autoconf automake bison flex texinfo \
              gperf help2man libtool-bin libncurses-dev unzip wget xz-utils \
              patch gawk python3-dev rsync \
              pkg-config python3 x11proto-dev
          # x11proto-dev is the Debian/Ubuntu package for the merged
          # xorgproto headers (xproto, kbproto, randrproto, ...) -- every
          # X.Org submodule build reads these from the HOST's
          # /usr/share/pkgconfig (see tools/build-x11-stack.sh's
          # PKG_CONFIG_LIBDIR). autoconf/automake/... etc. are
          # crosstool-NG's own build dependencies, needed to provision the
          # X11 toolchain below.

      # Slow-but-cacheable, entirely separate from gcc-arm-linux-gnueabi
      # above -- see this workflow's header for why the X11 stack needs
      # its own toolchain. Same script and tracked config
      # (tools/uclibc-toolchain.config) a fresh dev machine runs; nothing
      # CI-specific about it.
      - name: Cache X11/Matchbox toolchain (crosstool-NG build)
        id: x11-toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchain-x11
          key: x11-toolchain-v1-${{ hashFiles('tools/uclibc-toolchain.config', 'tools/build-uclibc-toolchain.sh') }}
          save-always: true

      - name: Provision X11/Matchbox toolchain
        id: x11_toolchain
        env:
          PIKO_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain-x11
        run: |
          set +e
          ./tools/build-uclibc-toolchain.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "TOOLCHAIN_BIN_DIR=${PIKO_TOOLCHAIN_DIR}/x-tools/arm-unknown-linux-uclibcgnueabi/bin" >> "$GITHUB_ENV"
          else
            echo "X11 toolchain provisioning failed (exit $rc) -- package will ship without the desktop." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only the raw downloaded tarballs -- keyed on the version pins
      # inside the script itself. NOT userspace/stage-target (the built
      # output): that gets rebuilt fresh every run, same reasoning as the
      # X11 submodules not being cached (see this workflow's header).
      - name: Cache third-party source downloads (zlib/expat/libpng/freetype/fontconfig/xkeyboard-config/dejavu)
        if: steps.x11_toolchain.outputs.rc == '0'
        uses: actions/cache@v4
        with:
          path: userspace/.thirdparty-cache
          key: thirdparty-src-v1-${{ hashFiles('tools/build-thirdparty-deps.sh') }}
          save-always: true

      - name: Build third-party X11 dependencies
        if: steps.x11_toolchain.outputs.rc == '0'
        run: |
          ./tools/build-thirdparty-deps.sh

      # Host-side tests for the Software Center's manifest/history parsing
      # and the piko-update progress protocol. No FLTK, no X, no device --
      # which is exactly why they are the part worth running here. They
      # guard the contract between piko-update (which writes those files
      # and emits those records) and pikostore (which reads them), and a
      # break there would otherwise only show up on the one spare board.
      #
      # The source arrives via the checkout's `submodules: recursive`
      # above; no separate init step is needed.
      - name: pikostore host tests (romstate)
        run: |
          g++ -O2 -Wall -Wextra \
              -o /tmp/romstate-test \
              userspace/src/pikostore/tests/romstate-test.cxx
          /tmp/romstate-test
      # scp + sftp-server (+ dbclient/dropbearkey) for the rootfs overlay.
      # An offline update package is what a device that is NOT reachable
      # over the network gets -- i.e. exactly the device that most needs
      # working file transfer the next time round.
      #
      # Reuses the uClibc toolchain provisioned above, and genuinely needs
      # it: these cannot be built with the apt gcc-arm-linux-gnueabi this
      # job uses for piko-update, even though they are equally static.
      # glibc routes getpwnam/getpwuid through NSS, which dlopen()s
      # libnss_files.so.2 at runtime out of a static binary too, and that
      # file does not exist on this rootfs -- sftp-server would link, pass
      # every ELF check, and then die with "No user found for uid 0" on
      # the device. tools/build-ssh.sh refuses to emit such a binary; see
      # its header.
      #
      # Non-fatal for the same reason the X11 steps are: a package with
      # the rootfs overlay and no SSH payload is still a real, useful
      # offline update, and better than no artifact at all.
      - name: Cache dropbear/OpenSSH release tarballs
        if: steps.x11_toolchain.outputs.rc == '0'
        uses: actions/cache@v4
        with:
          path: |
            userspace/src/dropbear-*.tar.bz2
            userspace/src/openssh-*.tar.gz
          key: ssh-tarballs-${{ hashFiles('tools/build-ssh.sh') }}
          save-always: true

      - name: Build scp + sftp-server (uClibc toolchain)
        if: steps.x11_toolchain.outputs.rc == '0'
        id: ssh_payload
        run: |
          set +e
          ./tools/build-ssh.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            {
              echo "### SSH file transfer payload"
              echo '```'
              find userspace/stage-ssh -type f -printf '%10s  %p\n' | sort -k2
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SSH payload build failed (exit $rc) -- package will ship without scp/sftp-server." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache kernel-src reconstruction
        id: kernel-src-cache
        uses: actions/cache@v4
        with:
          path: kernel-src
          key: kernel-src-7.1.4-${{ hashFiles('kernel.config-corgi-7.1.4', 'modules/**', 'tools/setup-kernel-src.sh') }}
          # actions/cache skips its post-job save step entirely whenever
          # the job's overall conclusion is "failure" -- every run so far
          # has failed somewhere after this point, so no run has ever
          # actually saved a cache entry reflecting real build progress.
          # save-always makes the (cheap, seconds-long) save unconditional
          # so a run that gets further than the last one before failing
          # still leaves a better starting point for the next one.
          save-always: true

      - name: Reconstruct kernel-src (download + apply tracked patches)
        id: kernel_src
        run: |
          set +e
          tools/setup-kernel-src.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "kernel-src fully reconstructed and ready to build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "kernel-src reconstruction failed (exit $rc) -- building a rootfs-only package instead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Discard cached build objects (keep source/config, not stale .o/.ko)
        # The kernel-src cache above is keyed on config/patches, not on build
        # state, and is saved unconditionally (save-always) even from a
        # failed run -- so any .o/.ko left in the tree from a previous,
        # possibly-interrupted build gets silently reused next time `make`
        # sees it as up to date. That's exactly how a corrupted
        # snd-ac97-codec.ko survived multiple CI runs with an identical size
        # each time (make relinked the .ko/.mod.o but never recompiled the
        # object underneath it -- there was no CC line for it in the build
        # log at all): not a packaging bug, a poisoned incremental build.
        # `make clean` drops generated objects but keeps .config and the
        # downloaded/patched source, so the expensive part of the cache
        # (network fetch + patching + oldconfig) is still preserved.
        if: steps.kernel_src.outputs.rc == '0'
        run: make -C kernel-src/linux-7.1.4 ARCH=arm clean

      - name: Build kernel (zImage + modules)
        if: steps.kernel_src.outputs.rc == '0'
        run: |
          make -C kernel-src/linux-7.1.4 ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- \
              -j"$(nproc)" zImage modules

      - name: Build update package
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          # flash/build-update-package.sh's own KERNEL_DIR default resolves
          # to this exact path -- tools/setup-kernel-src.sh can leave a real (if
          # incomplete/unbuilt) directory there even on failure, so omitting
          # the env var here would NOT actually fall back to rootfs-only,
          # it would still find that directory and hard-fail on "no built
          # zImage". Point KERNEL_DIR at something that can't exist instead,
          # so the rootfs-only path is genuinely forced whenever
          # reconstruction didn't fully succeed.
          if [ "${{ steps.kernel_src.outputs.rc }}" = "0" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel-src/linux-7.1.4" flash/build-update-package.sh "$GITHUB_WORKSPACE/update.tar"
          else
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel-src-not-ready" flash/build-update-package.sh "$GITHUB_WORKSPACE/update.tar"
          fi

      - name: QEMU smoke test (boot + insmod modules + piko-update dry-run)
        if: steps.kernel_src.outputs.rc == '0'
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          set +e
          # tee, not a plain redirect: this step's own console output is
          # what get_job_logs (and the Actions UI's live step log) actually
          # captures. A bare `> /tmp/smoke.log 2>&1` sends the boot log
          # (and thus the actual failure reason -- panic, missing PASS
          # marker, whatever) ONLY into GITHUB_STEP_SUMMARY, which isn't
          # visible through the job-logs API at all -- hit exactly this
          # diagnosing a real smoke-test failure with nothing but a bare
          # "Process completed with exit code 1" to go on.
          flash/qemu-smoke-test.sh "$GITHUB_WORKSPACE/kernel-src/linux-7.1.4" "$GITHUB_WORKSPACE/update.tar" 2>&1 | tee /tmp/smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### QEMU smoke test"
            echo
            echo '```'
            cat /tmp/smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Summarize package contents
        if: always()
        run: |
          # Also to plain stdout, not just $GITHUB_STEP_SUMMARY -- the
          # latter is only rendered client-side in the Actions UI and
          # isn't reachable through the job-logs API at all, so a listing
          # that only went there was invisible while diagnosing a real
          # failure (had to guess at file sizes/contents from CI log
          # excerpts instead of just reading them).
          echo "==> update.tar contents (sizes, perms):"
          tar tvf update.tar
          {
            echo "### piko-update package"
            echo
            echo '```'
            tar tvf update.tar
            echo '```'
            echo
            echo "MANIFEST:"
            echo
            echo '```'
            tar xf update.tar -O MANIFEST
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update.tar
        uses: actions/upload-artifact@v4
        with:
          name: piko-update-package
          path: update.tar
          if-no-files-found: error

      - name: Upload update.tar (debug, smoke test failed -- NOT validated)
        # A package that fails the smoke test is never uploaded as the
        # real "piko-update-package" artifact above -- that invariant
        # stays. This is a separate, clearly-labeled debug copy purely so
        # a failure can actually be diagnosed (file sizes/checksums
        # inspected directly) without re-deriving them from CI log
        # excerpts -- never treat this one as a validated package.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piko-update-package-DEBUG-UNVALIDATED
          path: update.tar
          if-no-files-found: ignore
