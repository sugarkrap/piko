name: Build piko-update package

# Builds the offline update.tar package for userspace/src/piko-update.c
# (flash/build-update-package.sh) and uploads it as a workflow artifact.
#
# IMPORTANT SCOPE NOTE: kernel-src/ (the patched Linux 7.1.4 tree, see
# docs/HOWTO-BUILD-DEPLOY-KERNEL.md) is gitignored and only ever exists on
# a local dev machine with the buildroot toolchain already set up -- it is
# NOT vendored in this repo, so this workflow CANNOT build the stage-2
# zImage or kernel modules. flash/build-update-package.sh detects that and
# falls back to a "rootfs-only" package: piko-update itself (freshly
# cross-compiled here) plus the full rootfs/ overlay (etc/, usr/sbin/,
# init). That is already a real, useful, completely offline update on its
# own -- it just won't contain a kernel bump. For a full kernel+modules
# package, run flash/build-update-package.sh locally with KERNEL_DIR
# pointed at a built kernel-src checkout.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "userspace/src/**"
      - "rootfs/**"
      - "flash/build-update-package.sh"
      - ".github/workflows/build-update-package.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabi

      - name: Build update package
        env:
          CROSS_COMPILE: arm-linux-gnueabi-
        run: |
          flash/build-update-package.sh "$GITHUB_WORKSPACE/update.tar"

      - name: Summarize package contents
        run: |
          {
            echo "### piko-update package"
            echo
            echo '```'
            tar tvf update.tar
            echo '```'
            echo
            echo "MANIFEST:"
            echo
            echo '```'
            tar xf update.tar -O MANIFEST
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update.tar
        uses: actions/upload-artifact@v4
        with:
          name: piko-update-package
          path: update.tar
          if-no-files-found: error
