# mdev device rules for zaurus-refresh stage 2.
# Format: <device regex> <uid>:<gid> <perms> [@|$|*<command>]

# Core device nodes (devtmpfs already creates them; these fix ownership/perms).
null            root:root 666
zero            root:root 666
full            root:root 666
random          root:root 444
urandom         root:root 444
console         root:tty  600
ptmx            root:tty  666
tty             root:tty  666
tty[0-9]*       root:tty  660
vcs[0-9]*       root:tty  660
vcsa[0-9]*      root:tty  660
# '*' runs the hook on BOTH add and remove (see /usr/sbin/sdcard). The old
# '@' (add-only) rule never handled removal, so a pulled card left a
# phantom /mnt/card mount that hung poweroff -- fixed 2026-07-27.
mmcblk0p1       root:disk 660 */usr/sbin/sdcard
mmcblk[0-9].*   root:disk 660
mtdblock[0-9]*  root:disk 660

# Auto-load the driver when a device announces a MODALIAS (e.g. a PCMCIA
# card is inserted) -- this is what turns "card inserted" into hostap_cs
# (+ its hostap/lib80211/pcmcia dependencies, via modules.dep) being
# loaded automatically, with no manual modprobe needed.
$MODALIAS=.*    root:root 660 @modprobe -b "$MODALIAS"

# Once the card driver creates wlan0 (a net uevent, not a /dev node --
# mdev handles both), bring the link up automatically.
wlan0           root:root 660 @/etc/wifi-up.sh

